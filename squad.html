
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Details | VCL 2026</title>

  <style>
    :root {
      --navy: #111827;
      --navy-light: #202d43;
      --turquoise: #26c6c5;
      --turquoise-dark: #139b9a;
      --gold: #f4c95d;
      --background: #f5f7fa;
      --white: #ffffff;
      --text: #182131;
      --muted: #737d8d;
      --border: #e3e8ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--navy);
      color: white;
      padding: 14px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 3px solid var(--turquoise);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand h2 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 0;
      color: var(--turquoise);
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* NAVIGATION */
    .menu {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .menu a {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      padding: 10px 0;
      border-bottom: 2px solid transparent;
    }

    .menu a:hover {
      color: var(--turquoise);
      border-bottom-color: var(--turquoise);
    }

    /* PAGE TITLE */
    .page-heading {
      background: linear-gradient(120deg, var(--navy), var(--navy-light));
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    .page-heading .eyebrow {
      color: var(--turquoise);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      margin: 0 0 10px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 30px;
    }

    .page-heading p {
      color: #cbd5e1;
      font-size: 14px;
      margin: 10px 0 0;
    }

    /* MATCH CONTENT */
    .container {
      width: 92%;
      max-width: 760px;
      margin: 30px auto;
    }

    .match-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(17, 24, 39, 0.06);
    }

    .match-card-header {
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .match-label {
      display: inline-block;
      background: #e7fafa;
      color: var(--turquoise-dark);
      border: 1px solid #c4eeee;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .match-card-header h2 {
      margin: 14px 0 0;
      font-size: 22px;
    }

    .score-area {
      padding: 25px 20px;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 18px;
      margin-bottom: 12px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .score-row:last-child {
      margin-bottom: 0;
    }

    .team-name {
      font-size: 15px;
      font-weight: bold;
    }

    .score {
      font-size: 21px;
      font-weight: bold;
      color: var(--navy);
      text-align: right;
    }

    .overs {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: normal;
      margin-top: 5px;
    }

    .result-box {
      background: var(--navy);
      color: white;
      padding: 22px 18px;
      text-align: center;
      border-top: 3px solid var(--turquoise);
    }

    .result-box p {
      color: var(--turquoise);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
      margin: 0 0 10px;
    }

    .result-box h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.5;
    }

    .not-found {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    .back-button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 20px;
      border-radius: 7px;
      background: var(--turquoise);
      color: var(--navy);
      font-weight: bold;
      font-size: 13px;
      text-decoration: none;
    }

    .back-button:hover {
      background: var(--gold);
    }

    footer {
      margin-top: 45px;
      padding: 22px 15px;
      text-align: center;
      background: var(--navy);
      color: #aeb8c8;
      font-size: 12px;
    }

    footer strong {
      color: var(--turquoise);
    }

    @media (max-width: 600px) {
      .header {
        justify-content: center;
        text-align: center;
        padding: 16px 12px;
      }

      .brand {
        justify-content: center;
      }

      .menu {
        justify-content: center;
        gap: 15px;
      }

      .menu a {
        font-size: 12px;
      }

      .page-heading {
        padding: 28px 15px;
      }

      .page-heading h1 {
        font-size: 25px;
      }

      .container {
        width: 94%;
        margin: 20px auto;
      }

      .score-row {
        padding: 14px 12px;
      }

      .team-name {
        font-size: 13px;
      }

      .score {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <img
        class="logo"
        src="file_00000000fafc7208bb91a6123810609b.png"
        alt="VCL Logo"
        onerror="this.style.display='none'"
      >
      <div>
        <h2>VCL 2026</h2>
        <p>VATKHURA CRICKET LEAGUE</p>
      </div>
    </div>

    <nav class="menu">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures</a>
      <a href="points.html">Points Table</a>
      <a href="squad.html">Teams</a>
    </nav>
  </header>

  <section class="page-heading">
    <p class="eyebrow">VCL 2026 • SESSION 03</p>
    <h1>Match Details</h1>
    <p>Match scorecard and final result</p>
  </section>

  <main class="container">
    <div class="match-card" id="matchData">
      <div class="not-found">Loading match details...</div>
    </div>

    <div style="text-align:center;">
      <a class="back-button" href="fixtures.html">
        ← Back to Fixtures
      </a>
    </div>
  </main>

  <footer>
    <strong>VCL 2026</strong> — Vatkhura Cricket League
    <br><br>
    Passion • Teamwork • Cricket
  </footer>

  <script>
    const data = {
      1: {
        teams: "Team A vs Team B",
        scores: [
          {
            team: "Team A",
            score: "120/6",
            overs: "10 overs"
          },
          {
            team: "Team B",
            score: "100/9",
            overs: "10 overs"
          }
        ],
        result: "Team A won by 20 runs"
      },

      2: {
        teams: "Team C vs Team D",
        scores: [
          {
            team: "Team C",
            score: "150/5",
            overs: "Overs not specified"
          },
          {
            team: "Team D",
            score: "151/4",
            overs: "Overs not specified"
          }
        ],
        result: "Team D won by 6 wickets"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const match = data[id];
    const matchData = document.getElementById("matchData");

    if (match) {
      matchData.innerHTML = `
        <div class="match-card-header">
          <span class="match-label">MATCH ${id}</span>
          <h2>${match.teams}</h2>
        </div>

        <div class="score-area">
          ${match.scores.map(item => `
            <div class="score-row">
              <div class="team-name">${item.team}</div>
              <div class="score">
                ${item.score}
                <span class="overs">${item.overs}</span>
              </div>
            </div>
          `).join("")}
        </div>

        <div class="result-box">
          <p>FINAL RESULT</p>
          <h3>${match.result}</h3>
        </div>
      `;
    } else {
      matchData.innerHTML = `
        <div class="not-found">
          <h2>Match Not Found</h2>
          <p>Please check the match ID or return to the fixtures page.</p>
        </div>
      `;
    }
  </script>

</body>
</html>
